<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fredoka:wght@700&family=Lobster&family=Pacifico&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    display:flex; align-items:center; justify-content:center; padding:16px;
    background: radial-gradient(ellipse at 50% 40%, #4a1238 0%, #1f0a22 55%, #10051a 100%);
  }
  #fondo { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  #lienzo {
    position:relative; z-index:1;
    width:100%; max-width:1200px; max-height:100%; height:auto; display:block;
    background: radial-gradient(ellipse at center, rgba(255,60,120,.22) 0%, rgba(255,60,120,0) 70%);
  }
</style>
</head>
<body>

<canvas id="fondo"></canvas>
<canvas id="lienzo"></canvas>

<script>
/* ===================== CONFIGURACIÓN (edita solo aquí) ===================== */
const CONFIG = {
  texto: "Te Amo Mi Vida",      // el texto que se verá. Usa | o \n para varias líneas (ej: "Te|Amo")
  paleta: "rojos",      // "rojos" | "rosas" | "mixto" | "arcoiris" | "dorado"
  fuente: "lobster",    // "lobster" | "pacifico" | "fredoka" | "baloo" | "gruesa"
  espaciado: 13,        // tamaño de los corazones (menor = más pequeños y más detalle)
  animar: true,         // aparición + latido (false = imagen quieta)
  rosasCayendo: true,   // rosas rojas cayendo de fondo (false = sin rosas)
  cantidadRosas: 45     // cuántas rosas a la vez (más = más lluvia de rosas)
};
const ANCHO = 1200;     // ancho lógico del lienzo
/* =========================================================================== */

const FUENTES = {
  lobster:  fs => `${fs}px Lobster, "Brush Script MT", cursive`,
  pacifico: fs => `${fs}px Pacifico, "Brush Script MT", cursive`,
  fredoka:  fs => `700 ${fs}px Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`,
  baloo:    fs => `800 ${fs}px "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`,
  gruesa:   fs => `900 ${fs}px "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif`
};

/* ---------- colores ---------- */
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function mezclar(a, b, t) {
  const A = hex2rgb(a), B = hex2rgb(b);
  return "#" + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, "0")).join("");
}
function hslHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)))));
  return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("");
}
const ROJOS = [["#ff6b81", "#b0001f"], ["#ff4d6d", "#8a0a24"], ["#ff3b5c", "#a4133c"], ["#ff8a9a", "#c1121f"], ["#e5383b", "#7a0a1e"]];
const ROSAS = [["#ffb3d1", "#e0407f"], ["#ff8fb8", "#c2185b"], ["#ffc2dc", "#f06292"], ["#ff9ec7", "#d81b60"], ["#ffd1e6", "#ec6fa5"]];
const PALETAS = {
  rojos: ROJOS,
  rosas: ROSAS,
  mixto: [...ROJOS, ...ROSAS, ["#d6a2ff", "#7b2cbf"], ["#c77dff", "#5a189a"]],
  arcoiris: Array.from({ length: 12 }, (_, i) => [hslHex(i * 30, 95, 70), hslHex(i * 30, 80, 38)]),
  dorado: [["#fff0a8", "#e0a100"], ["#ffd966", "#b8860b"], ["#ffe680", "#d4a017"], ["#ffeaa0", "#c98f00"]]
};

/* ---------- el corazón (unidades de radio = 1) ---------- */
function dibujarCorazon(c, [claro, oscuro]) {
  c.beginPath();
  c.moveTo(0, -0.38);
  c.bezierCurveTo(0, -0.92, -1, -0.92, -1, -0.24);
  c.bezierCurveTo(-1, 0.38, -0.3, 0.66, 0, 1);
  c.bezierCurveTo(0.3, 0.66, 1, 0.38, 1, -0.24);
  c.bezierCurveTo(1, -0.92, 0, -0.92, 0, -0.38);
  c.closePath();
  const g = c.createRadialGradient(-0.35, -0.45, 0.05, 0, 0.05, 1.25);
  g.addColorStop(0, claro);
  g.addColorStop(1, oscuro);
  c.fillStyle = g; c.fill();
  c.lineWidth = 0.07; c.strokeStyle = mezclar(oscuro, "#000000", 0.45); c.stroke();
  c.save(); c.rotate(-0.65);
  c.beginPath(); c.ellipse(-0.45, -0.52, 0.24, 0.11, 0, 0, Math.PI * 2);
  c.fillStyle = "rgba(255,255,255,.55)"; c.fill(); c.restore();
  c.beginPath(); c.arc(-0.62, -0.1, 0.06, 0, Math.PI * 2);
  c.fillStyle = "rgba(255,255,255,.5)"; c.fill();
}

/* ---------- sprites pre-renderizados (nítidos y rápidos) ---------- */
const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
const R_PX = 52 * DPR;
function crearSprite(par) {
  const s = document.createElement("canvas");
  s.width = s.height = Math.ceil(R_PX * 2 + 6);
  const c = s.getContext("2d");
  c.translate(s.width / 2, s.height / 2);
  c.scale(R_PX * 0.97, R_PX * 0.97);
  dibujarCorazon(c, par);
  return s;
}
let SPR_INT = [], SPR_BORDE = [];
function prepararSprites() {
  const pal = PALETAS[CONFIG.paleta] || ROJOS;
  SPR_INT = pal.map(crearSprite);
  // contorno: tonos más oscuros para que la forma de las letras se lea bien
  SPR_BORDE = pal.map(([cl, os]) => crearSprite([mezclar(cl, os, 0.4), mezclar(os, "#000000", 0.3)]));
}
const elegir = a => a[Math.floor(Math.random() * a.length)];
function barajar(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

/* ---------- máscara del texto ---------- */
let H = 320;
function pintarMascara(lineas, fs, dx = 0, dy = 0) {
  const off = document.createElement("canvas");
  off.width = ANCHO; off.height = H;
  const o = off.getContext("2d", { willReadFrequently: true });
  o.font = (FUENTES[CONFIG.fuente] || FUENTES.gruesa)(fs);
  o.fillStyle = "#000"; o.textAlign = "center"; o.textBaseline = "middle";
  lineas.forEach((l, i) => o.fillText(l, ANCHO / 2 + dx, H / 2 + dy + (i - (lineas.length - 1) / 2) * fs * 1.1));
  const d = o.getImageData(0, 0, ANCHO, H).data;
  let minX = ANCHO, maxX = 0, minY = H, maxY = 0;
  for (let y = 0; y < H; y += 2)
    for (let x = 0; x < ANCHO; x += 2)
      if (d[(y * ANCHO + x) * 4 + 3] > 110) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
  return { d, minX, maxX, minY, maxY, vacio: maxX < minX };
}

/* Escala el texto para llenar el lienzo, lo centra y calcula dónde van los corazones */
function calcularPuntos(texto, esp) {
  const lineas = texto.replace(/\\n/g, "\n").split(/[\n|]/).map(l => l.trim()).filter(Boolean);
  if (!lineas.length) lineas.push("Te Amo");
  H = 240 * lineas.length + 80;
  const m = 46;

  let fs = 200, r = pintarMascara(lineas, fs);
  for (let it = 0; it < 3 && !r.vacio; it++) {
    const k = Math.min((ANCHO - 2 * m) / (r.maxX - r.minX + 1), (H - 2 * m) / (r.maxY - r.minY + 1));
    fs = Math.max(20, Math.min(700, fs * k));
    r = pintarMascara(lineas, fs);
  }
  if (r.vacio) return [];
  r = pintarMascara(lineas, fs, ANCHO / 2 - (r.minX + r.maxX) / 2, H / 2 - (r.minY + r.maxY) / 2);

  const d = r.d;
  const a = (x, y) => (x < 0 || y < 0 || x >= ANCHO || y >= H) ? 0 : d[((y | 0) * ANCHO + (x | 0)) * 4 + 3] / 255;
  const dentro = (x, y) => a(x, y) > 0.43;
  const res = [];

  // 1) relleno: cuadrícula hexagonal, solo donde el corazón cabe dentro de la letra
  const paso = esp * 0.866, rr = esp * 0.5;
  const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1], [.7, .7], [-.7, .7], [.7, -.7], [-.7, -.7]];
  let fila = 0;
  for (let y = paso / 2; y < H; y += paso, fila++) {
    const desf = (fila % 2) * esp / 2;
    for (let x = desf + esp / 2; x < ANCHO; x += esp) {
      if (!dentro(x, y)) continue;
      if (dirs.every(([ux, uy]) => dentro(x + ux * rr, y + uy * rr))) res.push({ x, y, borde: false });
    }
  }

  // 2) contorno: corazones encadenados siguiendo el borde real de cada letra
  const contorno = [];
  for (let y = 1; y < H - 1; y += 2)
    for (let x = 1; x < ANCHO - 1; x += 2)
      if (dentro(x, y) && (!dentro(x + 2, y) || !dentro(x - 2, y) || !dentro(x, y + 2) || !dentro(x, y - 2))) contorno.push([x, y]);
  barajar(contorno);

  const re = esp * 0.78, dmin = esp * 0.6, celda = dmin;
  const hash = new Map();
  const clave = (cx, cy) => cx + "," + cy;
  for (const [x, y] of contorno) {
    const cx = Math.floor(x / celda), cy = Math.floor(y / celda);
    let libre = true;
    for (let i = -1; i <= 1 && libre; i++)
      for (let j = -1; j <= 1 && libre; j++) {
        const lista = hash.get(clave(cx + i, cy + j));
        if (lista && lista.some(([px, py]) => (px - x) ** 2 + (py - y) ** 2 < dmin * dmin)) libre = false;
      }
    if (!libre) continue;
    const k = clave(cx, cy);
    if (!hash.has(k)) hash.set(k, []);
    hash.get(k).push([x, y]);

    // empuja el corazón hacia el interior de la letra para que no se salga del trazo
    const s = 3;
    const gx = a(x + s, y) - a(x - s, y) + 0.5 * (a(x + s, y + s) - a(x - s, y + s) + a(x + s, y - s) - a(x - s, y - s));
    const gy = a(x, y + s) - a(x, y - s) + 0.5 * (a(x + s, y + s) - a(x + s, y - s) + a(x - s, y + s) - a(x - s, y - s));
    const len = Math.hypot(gx, gy);
    let px = x, py = y;
    if (len > 0.01) {
      const nx = x + (gx / len) * re * 0.7, ny = y + (gy / len) * re * 0.7;
      if (dentro(nx, ny)) { px = nx; py = ny; }
    }
    res.push({ x: px, y: py, borde: true });
  }
  return res;
}

/* ---------- escena ---------- */
let puntos = [], inicio = 0;
const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d");

async function cargarFuente() {
  const f = (FUENTES[CONFIG.fuente] || FUENTES.gruesa)(100);
  try {
    await Promise.race([document.fonts.load(f, CONFIG.texto), new Promise(r => setTimeout(r, 2500))]);
  } catch (e) { /* si falla, se usa la fuente de respaldo */ }
}

async function generar() {
  await cargarFuente();
  prepararSprites();
  const esp = CONFIG.espaciado;
  const pts = calcularPuntos(CONFIG.texto, esp);

  lienzo.width = Math.round(ANCHO * DPR);
  lienzo.height = Math.round(H * DPR);

  const hechos = pts.map(p => ({
    x: p.x, y: p.y, borde: p.borde,
    radio: esp * (p.borde ? 0.78 : 0.68) * (0.95 + Math.random() * 0.1),
    sprite: elegir(p.borde ? SPR_BORDE : SPR_INT),
    rot: (Math.random() - 0.5) * 0.55,
    fase: Math.random() * Math.PI * 2,
    retraso: (p.x / ANCHO) * 1000 + Math.random() * 250
  }));
  // primero el relleno y encima el contorno
  puntos = [...barajar(hechos.filter(p => !p.borde)), ...barajar(hechos.filter(p => p.borde))];
  inicio = performance.now();
  requestAnimationFrame(dibujar);
}

const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
// doble latido "lub-dub"
function latido(ms) {
  const c = (((ms % 1500) + 1500) % 1500) / 1500;
  return Math.exp(-Math.pow((c - 0.10) / 0.05, 2)) + 0.7 * Math.exp(-Math.pow((c - 0.27) / 0.06, 2));
}

function dibujar(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, lienzo.width, lienzo.height);
  const tr = t - inicio;

  for (const p of puntos) {
    let esc = 1, rot = p.rot;
    if (CONFIG.animar) {
      const prog = Math.min(Math.max((tr - p.retraso) / 550, 0), 1);
      if (prog === 0) continue;
      esc = easeOutBack(prog) * (1 + 0.10 * latido(tr - p.x * 0.5));  // el latido viaja en onda
      rot += 0.05 * Math.sin(tr / 900 + p.fase);
    }
    const cos = Math.cos(rot) * esc * DPR, sin = Math.sin(rot) * esc * DPR;
    ctx.setTransform(cos, sin, -sin, cos, p.x * DPR, p.y * DPR);
    ctx.drawImage(p.sprite, -p.radio, -p.radio, p.radio * 2, p.radio * 2);
  }
  if (CONFIG.animar) requestAnimationFrame(dibujar);
}

/* ---------- rosas rojas cayendo de fondo ---------- */
const TAU = Math.PI * 2;

function dibujarRosa(c, [claro, oscuro]) {
  c.beginPath(); c.arc(0, 0, 1, 0, TAU);
  c.fillStyle = mezclar(oscuro, "#000000", 0.35); c.fill();
  const capas = 4;
  for (let k = 0; k < capas; k++) {
    const rad = 0.98 - k * 0.22;
    const n = k < 3 ? 5 : 3;
    const rot = Math.random() * TAU;
    const color = mezclar(claro, oscuro, k / (capas - 1));
    for (let i = 0; i < n; i++) {
      const a = rot + (i * TAU) / n;
      c.beginPath();
      c.arc(Math.cos(a) * rad * 0.42, Math.sin(a) * rad * 0.42, rad * 0.62, 0, TAU);
      c.fillStyle = color; c.fill();
      c.lineWidth = 0.04; c.strokeStyle = "rgba(60,0,15,.4)"; c.stroke();
    }
  }
  c.beginPath();                                   // espiral central
  for (let t = 0; t < 9; t += 0.2) {
    const r = 0.02 + t * 0.022;
    const x = Math.cos(t) * r, y = Math.sin(t) * r;
    t === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
  }
  c.lineWidth = 0.05; c.strokeStyle = mezclar(oscuro, "#000000", 0.5); c.stroke();
}

const PAL_ROSA = [["#ff6b81", "#9d0208"], ["#ff5c5c", "#7a0a1e"], ["#e5383b", "#6a040f"], ["#ff4d6d", "#800f2f"], ["#ff7b7b", "#8d0801"]];
const fondo = document.getElementById("fondo");
const fctx = fondo.getContext("2d");
let SPR_ROSA = [], rosas = [], fw = 0, fh = 0, tPrev = 0;

function crearSpriteRosa(par) {
  const s = document.createElement("canvas");
  s.width = s.height = Math.ceil(R_PX * 2 + 6);
  const c = s.getContext("2d");
  c.translate(s.width / 2, s.height / 2);
  c.scale(R_PX * 0.97, R_PX * 0.97);
  dibujarRosa(c, par);
  return s;
}

function nuevaRosa(inicial) {
  const prof = Math.random();                      // 0 = lejos (pequeña, lenta), 1 = cerca (grande, rápida)
  const r = 12 + prof * 26;
  return {
    x: Math.random() * fw, y: inicial ? Math.random() * (fh + 100) - 50 : -r * 2,
    r, v: 35 + prof * 75 + Math.random() * 20,
    amp: 12 + Math.random() * 30, frec: 0.4 + Math.random() * 0.8, fase: Math.random() * TAU,
    rot: Math.random() * TAU, vrot: (Math.random() - 0.5) * 1.2, tumb: Math.random() * TAU,
    alfa: 0.45 + prof * 0.5, sprite: elegir(SPR_ROSA)
  };
}

function ajustarFondo() {
  fw = window.innerWidth; fh = window.innerHeight;
  fondo.width = Math.round(fw * DPR); fondo.height = Math.round(fh * DPR);
  const n = Math.round(CONFIG.cantidadRosas * Math.min(1, fw / 1100 + 0.4));
  rosas = Array.from({ length: n }, () => nuevaRosa(true)).sort((a, b) => a.r - b.r);  // las grandes quedan delante
}

function animarFondo(t) {
  const dt = Math.min((t - tPrev) / 1000, 0.05); tPrev = t;
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.clearRect(0, 0, fondo.width, fondo.height);
  for (const p of rosas) {
    p.y += p.v * dt; p.rot += p.vrot * dt;
    if (p.y > fh + p.r * 2) { p.y = -p.r * 2; p.x = Math.random() * fw; }
    const x = p.x + Math.sin((t / 1000) * p.frec + p.fase) * p.amp;
    const sy = 0.78 + 0.22 * Math.abs(Math.cos(t / 1600 + p.tumb));   // leve volteo al caer
    const cos = Math.cos(p.rot) * DPR, sin = Math.sin(p.rot) * DPR;
    fctx.setTransform(cos, sin, -sin * sy, cos * sy, x * DPR, p.y * DPR);
    fctx.globalAlpha = p.alfa;
    fctx.drawImage(p.sprite, -p.r, -p.r, p.r * 2, p.r * 2);
  }
  fctx.globalAlpha = 1;
  requestAnimationFrame(animarFondo);
}

if (CONFIG.rosasCayendo) {
  SPR_ROSA = PAL_ROSA.map(crearSpriteRosa);
  ajustarFondo();
  let temporizador;
  window.addEventListener("resize", () => { clearTimeout(temporizador); temporizador = setTimeout(ajustarFondo, 150); });
  tPrev = performance.now();
  requestAnimationFrame(animarFondo);
} else {
  fondo.style.display = "none";
}

generar();
</script>
</body>
</html>
